[project]
name = "image-processor"
version = "0.1.0"
description = "Basic Image Processing App"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argparse>=1.4.0",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "scipy>=1.18.0",
]

[project.scripts]
image-processor = "image_processor:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
